# Cora autonomy-ladder REGISTRY (Code #13 slice 7, cq-6afa86210ba0; charter v1
# section 1 R-A; roadmap v2 WS-B). Schema + rules: src/cora/ladder_registry.py.
#
# ONE ROW PER LANE. Tier = what the lane does WITHOUT a human tap, as evidenced by
# code (T0 propose-only -> T1 approve-then-act -> T2 act-with-audit -> T3 standing;
# CAP-T1 = a deliberate permanent T1 cap). `status` is the LIFECYCLE (live | dark |
# unbuilt | cowork-estate) and is NOT a tier. `evidence_monitor.failing_capable`
# must be true for any tier above T1 (no failing-capable monitor = no promotion
# past T1). Every tier change is an `events[]` entry with evidence; no lane skips
# a tier; demotion is automatic on an unapproved action / failed audit / class WARN.
# ENFORCED by ladder_registry.validate (D-051 EF-8): a seeded/promoted/demoted
# event carries `tier:` = the tier the lane holds AFTER it; the LAST such event
# must equal the row's `tier` (edit `tier` without appending an event -> schema
# violation), a `promoted` event is exactly one rank up, a `demoted` event is
# strictly lower.
#
# WRITTEN ONLY BY A CODE/COWORK COMMIT. The bot never writes this file. Every row
# is `confirmed_by: pending-Harrison` until his ONE batch confirm (Code #13 report
# ask block) flips it -- FLIPPED 2026-09-20 by Cowork on Harrison's 2026-09-19 ruling
# (all lanes confirmed as seeded except nightly-catchup: ruled T1, `demoted` event).
# The rendered markdown rides ZONE-X via the claude-workspace
# mirror as cora-mirror-LADDER-REGISTRY.md (KB-excluded by folder pin + title belt).
#
# Rows carried VERBATIM (values) from their bespoke sources: s2-phantom-write-screen
# + c2-mechanical-batch-expiry (Code #12 report section 4), cora-self-inventory
# (ingest-integrity report section 4), claude-workspace-mirror
# (_mirror/cora-mirror-LADDER-ROW.md). The bespoke key `demotion` is `demotion_triggers` here.
