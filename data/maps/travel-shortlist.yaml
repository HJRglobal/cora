# Travel shortlist lane (Code #16 C2, cq-e9ef3f581d60; ladder row travel-shortlist, T0).
#
# Read by src/cora/travel_shortlist.py. DATA, not code: the lane's surfaces and its
# area allowlist live here so a channel rename or a new city is a data edit.
#
# Privacy contract (kickoff 2026-09-21 C2): the lane's web request is rendered ONLY
# from parsed fields -- dates, an area named on THIS list, party size, nightly budget,
# beds/bedrooms, lodging type and a fixed style vocabulary. A place the list does not
# carry is never searched (the lane asks for a city instead), because a free-text
# "area" can carry a name ("near X's gym"). Every token of every `name` / `state`
# below is part of the request belt's allowlist, so keep entries to real place names.

version: 1

# @mention surface. Keyed by ID (routing is name-based and a rename must not move
# the lane). C0C145H84JZ = #hjr-travel-booking (private; Cora is a member --
# verified read-only 2026-09-25). Channel `message` events do not reach the app, so
# an ask here must @mention Cora.
channel_ids:
  - C0C145H84JZ

# DM surface: Harrison (HARRISON_SLACK_USER_ID, always allowed) plus these roster
# handles, resolved through org_roles.find_by_handle -- never a hardcoded Slack id.
# An unresolved handle logs a WARN and simply has no DM surface (the normal Q&A path
# still withholds web tools from any lodging-shaped turn).
dm_user_handles:
  - tessa

# Area allowlist: canonical `name` + `state` (rendered "Name, State") and lowercase
# `aliases` (matched as whole words, and only in locative context -- "in X",
# "near X", "the X area", or a slash/comma list that is -- so a surname or a
# possessive "X's" is never read as a place). Two more slots, both closed (D-051 r3):
# right after a fresh ask's lodging noun, a date or a bed/price phrase ("find hotels
# scottsdale oct 17-21") -- never after "for" (a person) and never the everyday-word
# aliases surprise / page / carefree -- and, in a lane-thread follow-up, a clause that
# IS the refinement ("what about X?", "X or Y?", "X too", "prefer X"). `key` is the
# stable id stored in the lane's thread store. A locative alias hit is also one of the
# CUES that lets a weak lodging noun ("condos in Scottsdale") withhold web on the
# normal Q&A path (B1).
areas:
  # --- Phoenix metro + Arizona ---
  - {key: phoenix, name: Phoenix, state: Arizona, aliases: [phoenix, downtown phoenix, phx]}
  - {key: scottsdale, name: Scottsdale, state: Arizona, aliases: [scottsdale, old town scottsdale, north scottsdale, south scottsdale]}
  - {key: mesa, name: Mesa, state: Arizona, aliases: [mesa]}
  - {key: gilbert, name: Gilbert, state: Arizona, aliases: [gilbert]}
  - {key: tempe, name: Tempe, state: Arizona, aliases: [tempe]}
  - {key: chandler, name: Chandler, state: Arizona, aliases: [chandler]}
  - {key: glendale-az, name: Glendale, state: Arizona, aliases: [glendale]}
  - {key: peoria-az, name: Peoria, state: Arizona, aliases: [peoria]}
