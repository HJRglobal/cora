# Email accounts monitored by Cora for two purposes:
#   1. Attachment auto-filing (run_attachment_filer.py -- every 4h)
#   2. Full-thread KB ingestion (gmail_threaded_sweep.py -- nightly 2:30am AZ)
#
# DWD eligibility rules:
#   - Only works for accounts within Google Workspace orgs that Harrison
#     administers directly. The service account DWD grant must cover the
#     account's domain.
#   - @hjrglobal.com -- covered (primary HJR workspace, DWD confirmed active).
#   - @f3energy.com -- DWD confirmed active 2026-05-27 (Harrison confirmed domain admin).
#   - @lexingtonservices.com -- DWD confirmed active 2026-05-27 (Harrison confirmed domain admin).
#   - @unitedfightleague.com -- DWD confirmed active 2026-05-27 (Harrison confirmed domain admin).
#   - @bigd.media -- DWD confirmed active 2026-05-30 (Harrison confirmed domain admin).
#   - Personal Gmail (@gmail.com) -- NOT eligible for DWD ever.
#
# PHI NOTE for @lexingtonservices.com accounts:
#   gmail_threaded_sweep.py has a subject-keyword PHI guardrail (_is_phi_risk)
#   that skips chunks matching client-care terminology. Reconciliation engine
#   also enforces PHI exclusion before all passes. Harrison is sole authority
#   on access decisions per 2026-05-21 doctrine.
#
# thread_sweep: true -- include in gmail_threaded_sweep.py nightly KB run
# attachment_filer: true -- include in run_attachment_filer.py 4h run
# fireflies_seat: true -- current Fireflies Enterprise seat-holder (10 as of the
#   2026-07-01 right-size; decision doc 00-Founder/2026-07-01_fndr_fireflies-
#   enterprise-maximization-plan.md). Scopes the weekly coverage monitor
#   (run_fireflies_coverage.py): unflagged people stay in Gmail/Drive ingestion
#   but are never Fireflies-nudged. Flag ONE entry per human -- the loader
#   evaluates the flag across all of a person's collapsed alias entries.
# drive_sweep_mode: allowlist -- (D-303, ruled 2026-09-10; Code #13 slice 8) the
#   flat per-user Drive sweep for THIS row ingests ONLY files whose resolved
#   folder ancestry touches an id in drive_sweep_allowlist; everything else is
#   skipped and COUNTED (skipped_outside_allowlist=N on the sweep line), never
#   held. Unresolved ancestry still HOLDS the watermark; the pinned exclusions
#   (kb_exclusions.KB_EXCLUDED_FOLDER_IDS) + title belts stay the BELT and win
#   even inside the allowlist; markdown inside the Founder-OS tree stays
#   static_md-owned. Absent key = denylist (today's behaviour). Any other value
#   is REFUSED (the row is not swept) -- a typo must never fall open to denylist.
#   Set it on the PRIMARY mailbox row only; alias rows carry no mode. Alias rows
#   of the SAME physical Drive (a shared slack_user_id, or a known_aliases entry
#   naming the primary) are COLLAPSED by run_sweep into ONE sweep of the primary
#   row (D-096; D-051 Code #13 review AD-1 -- a denylist alias row must never
#   re-ingest what the primary's allowlist skipped) and should ALSO carry
#   drive_sweep: false as the data-layer belt (harrison@f3energy.com and
#   harrison@lexingtonservices.com do, 2026-09-19).
# drive_sweep_allowlist: [ "<folder id>", ... ] -- the allowlisted Drive folder
#   ids for drive_sweep_mode: allowlist. MUST be non-empty in allowlist mode (an
#   empty list is REFUSED: it would silently ingest nothing forever). v1 = the
#   HJR-Founder-OS root (== drive_sweep.FOUNDERS_OS_ROOT_ID, pinned by test). A
#   tree-adjacent BUSINESS folder found by the migration manifest
#   (scripts/drive_sweep_allowlist_manifest.py) is ADDED here, never purged.
# intake_route: knowledge_review -- (Code #13 Rider 1 S-A, cq-8d16f1a557e5; the
#   8/18 PROVISION ruling) this mailbox is a SYSTEM INTAKE mailbox, not a human's.
#   Its ONLY consumer is scripts/run_mailbox_intake_sweep.py, which feeds each new
#   human-authored message through info_intake.ingest (the SAME chokepoint as
#   #info-for-cora: PHI + blanket-LEX refusal at ingest, propose-only, never
#   autowrite) as a PENDING knowledge-review proposal. A row carrying this key
#   MUST also set thread_sweep / attachment_filer / drive_sweep EXPLICITLY false
#   (all three default TRUE when absent, which would chunk-ingest the mailbox --
#   the opposite posture) and fireflies_seat false (the capture seat is tracked in
#   meeting-capture-roster.yaml; never double-flag it here). Absent key = an
#   ordinary human mailbox (today's behaviour for every other row). Any other
#   value is REFUSED by the sweep (the row is skipped + logged), never fallen open.

