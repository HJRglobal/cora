    command: 'cmd.exe /c cd /d "C:\Users\Harri\code\cora" & "C:\Users\Harri\code\cora\.venv\Scripts\python.exe" "C:\Users\Harri\code\cora\scripts\incremental_sync_asana.py"'
  - name: cowork-cora-kb-sync-fireflies
