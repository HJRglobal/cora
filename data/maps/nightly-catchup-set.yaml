# The NIGHTLY INGEST SET the missed-start catch-up lane watches (Code #13 slice 2,
# cq-fb50c9e6c911). Read by src/cora/nightly_catchup.py + scripts/check_missed_nightly.py.
#
# WHY: on 2026-09-09 the host was down 00:27-06:18 AZ; every task with a trigger in
# 02:00-06:10 AZ was lost, Task Scheduler replayed NONE of them (all carried
# StartWhenAvailable=true), and the 08:45 health check saw nothing. The 9/10 set ran
# normally, so the loss was one night -- but the estate had no missed-start catch-up.
#
# ORDER = the registered trigger time, ascending (the ruled order: mirror -> static
# -> capture -> sweep is a subsequence of it; commit a7cf77e pins static-before-
# capture; setup-session-capture-task.ps1 pins capture-after-the-KB-syncs).
#
# EVIDENCE that a task fired in its window (any ONE suffices):
#   * a run marker (logs/task-runs.jsonl) for the task inside the window;
#   * a run_hidden header `=== run_hidden <slug> | <UTC> UTC | <AZ> AZ ===` in
#     logs/tasks/<slug>-<UTC date>.log whose AZ stamp falls inside the window;
#   * Task Scheduler's own LastRunTime inside the window.
#   Only cowork-cora-session-capture writes a marker today, so the header line is
#   the load-bearing evidence for the other twelve.
#
# `command` is the FALLBACK child command (from the 2026-09-02/03 task XML backups);
# the lane prefers the LIVE registered action (Get-ScheduledTask ... Actions[0]) with
# the run_hidden prefix stripped, so setup-script drift can never re-run a stale
# command. `max_minutes` bounds the synchronous wait per replay.
#
# DEADLINE RULE: every row's deadline (trigger_az + grace_min, default 150) must be
# STRICTLY before the lane's single 08:30 AZ fire (nightly_catchup.LANE_FIRE_AZ) or
# the task reads skipped_not_due at every fire and is never replayed; load_set()
# refuses the set otherwise. Rows triggered at/after 05:55 carry an explicit
# grace_min for that reason (Drive Sweep 06:00 -> 145 = 08:25; 06:05 / 06:10 -> 130).
#
# `enabled: false` rows are CANDIDATES the 9/9 outage also lost but the kickoff did
# not name (reconciliation is registered as the 8th 'kb sync' task; qbo-token-refresh
# missing a night is a token-expiry risk; gap-autofill / info-for-cora are gated
# lanes). Harrison flips them with one edit (Code #13 report ask block).
window:
  start_az: "06:00"
  end_az: "12:00"
  default_grace_min: 150
  imminent_min: 20

tasks:
  - name: cowork-cora-kb-sync-slack
    trigger_az: "02:00"
    max_minutes: 60
    command: 'cmd.exe /c cd /d "C:\Users\Harri\code\cora" & "C:\Users\Harri\code\cora\.venv\Scripts\python.exe" "C:\Users\Harri\code\cora\scripts\incremental_sync_slack.py"'
  - name: cowork-cora-qbo-token-refresh
    trigger_az: "02:00"
    max_minutes: 30
    enabled: false
    command: 'C:\Users\Harri\code\cora\.venv\Scripts\python.exe "C:\Users\Harri\code\cora\scripts\qbo_oauth_flow.py" --refresh-all'
    notes: "candidate -- lost on 9/9 too; a missed refresh is a token-expiry risk; Harrison's call"
  - name: cowork-cora-kb-sync-gmail
    trigger_az: "02:30"
    max_minutes: 180
    command: 'cmd.exe /c cd /d "C:\Users\Harri\code\cora" & "C:\Users\Harri\code\cora\.venv\Scripts\python.exe" "C:\Users\Harri\code\cora\scripts\gmail_threaded_sweep.py"'
  - name: cowork-cora-kb-sync-asana
    trigger_az: "03:00"
