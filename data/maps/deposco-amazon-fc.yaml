# data/maps/deposco-amazon-fc.yaml -- Amazon FBA fulfillment-center address book,
# keyed by FC code. Read by src/cora/deposco_orders/spec.py + payload.py.
#
# Seeded from the live prod read-back 2026-09-23
# (`_notes/2026-09-23_f3e_deposco-prod-read-verification.md`, V3), which read
# the ship-to address off the two real, already-shipped FBA Sales Orders
# (`FBA19NG0MR50` -> GEU2, `FBA19P6VCSJW` -> GEU3). An unknown FC code in a
# spec is refused at validation rather than guessed -- add its address here
# first, sourced from Seller Central's Send-to-Amazon page for that shipment
# (per the SONNET-HANDOFF's FBA keying checklist), never invented.
#
# GEU3's `attention` field on the live order did not itself carry the FC code
# (it read "Amazon"); the code is asserted here from canon (the 2026-09-09
# ruling / 1ddddddddd), not re-derived from that order's own text.

facilities:
  GEU2:
    ship_to:
      name: "Amazon FBA"
      attention: "GEU2"
      addressLine1: "15301 W Northern Ave"
      city: "Litchfield Park"
      stateProvinceCode: "AZ"
      postalCode: "85340"
      countryCode: "US"
  GEU3:
    ship_to:
      name: "Amazon FBA"
      attention: "GEU3"
      addressLine1: "18900 W McDowell Rd"
      city: "Buckeye"
      stateProvinceCode: "AZ"
      postalCode: "85396"
      countryCode: "US"
