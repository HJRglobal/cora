# Daily Personalized Knowledge Check -- locked pilot roster + Tier-1 question bank.
#
# Design of record: 00-Founder/projects/build-personalized-daily-knowledge-check/
#   2026-08-11_fndr_daily-knowledge-check-design-v1.md  (APPROVED Harrison 2026-08-11)
#
# WHAT THIS FILE IS
# The bot-readable encoding of the "Instrumentation ledger" in
#   00-Founder/projects/map-staff-roles-to-cora-automation/
#   2026-08-04_fndr_daily-schedules-and-kpis-v1.md
# which is the LOCKED source of truth for who has which KPI and which of those
# KPIs are still "attested" (a human reports them, because the system of record
# sits outside Cora's read surface) rather than "system-read".
#
# The attested list IS the question bank. Every `items` entry below traces to a
# numbered KPI row in that doc. NOTHING here is invented -- an LLM-generated
# question is the exact failure class this design rejects (spec section 3), so
# the pool is derived ONLY from KPIs the ledger explicitly marks attested or
# gated-with-a-named-unlock. A KPI the ledger does not clearly place is left
# OUT: skipping a person beats asking them something ungrounded.
#
# EXPECTED EMPTY POOLS (spec section 3.4 -- not a bug):
# Tommy, Justin, Hannah and Jerry are already fully system-read, so they have no
# Tier-1 items and will mostly log skipped_no_gap unless a real Tier-2 gap lands
# that day. tests/test_knowledge_check.py pins this so it can never drift
# silently into "the mechanism is broken for those four".
#
# ROTATION, NOT CONSUMPTION (spec section 3.1): an item is re-asked at most once
# per ITEM_COOLDOWN_DAYS. Answering it does NOT consume it -- a confirmed answer
# is a dated status snapshot written with an operational TTL, not durable canon.
# An item retires only when its underlying source actually goes system-read via
# a real integration, which is a human edit to this file (set `retired: true`
# with a dated reason), never something the code infers from an answer.
#
# LEX POSTURE (Harrison's explicit, informed decision 2026-08-11): Shaun, Jen and
# Aaron are day-1 participants with NO PHI scrub or gating on their questions or
# answers -- treated identically to every other entity in this build. Escalation
# record: _notes/2026-08-11_fndr_ESCALATION-lex-phi-egress-scope.md (RESOLVED).
# The single code-level switch for that posture is knowledge_check.PHI_GATE_ANSWERS.
#
# EXCLUDED BY DESIGN: Jeff (oversight role, "no invented KPIs"), Sara (freelancer),
# and all of BDM (strawman held pending the Micah + Demi co-owner consult). Micah
# appears here for his OSN half ONLY -- his BDM half is deliberately out of scope,
# which is why his entity below is OSN and not his registry-primary BDM.
#
# Slack IDs are the canonical ones from data/maps/org-roles.yaml. A test asserts
# every roster slack_id resolves to that registry, so a roster typo cannot DM a
# stranger.

