# ── CARVE-OUTS ───────────────────────────────────────────────────────────────
# Ruled by Harrison: a no-record list (counsel, personal, strict-container topics
# such as the OneAmerica / personal-legal-planning class), plus a title escape hatch
# anyone can type. A carve-out HIT is never silently swallowed: the ensure-lane
# writes a ledger row and the auditor counts it, so over-blocking is visible.
#
# These patterns are matched case-insensitively as WHOLE WORDS against the event
# title (so "counsel" does not fire on "counselor-approved" and, more importantly,
# a substring like "legal" cannot fire inside "paralegal"). Keep them SPECIFIC --
# a broad word here silently stops capture for meetings that should be recorded,
# which is the failure mode that is hardest to notice.
carve_outs:
  # Anyone can add this marker to a calendar title to stop the bot. Matched as a
  # literal substring, case-insensitive -- NOT word-boundary -- because the brackets
  # are the whole point and they are not word characters.
  skip_title_markers:
    - "[no-bot]"
    - "[nobot]"

  # Whole-word title patterns. Seeded conservatively from Harrison's ruling.
  no_record_title_patterns:
    - "counsel"
    - "attorney"
    - "oneamerica"
    - "estate planning"
    - "personal legal"
    - "deposition"
    - "therapy"
    # DocuSign-class notifications with auto-added Meet links are not meetings --
    # ruled 2026-08-28 (cascade report section 7 item 6: each one otherwise reads
    # as a false MISS in the daily audit; the "Q2 401(k) sign electronically" row).
    - "docusign"
    - "sign electronically"

  # Any event organized by, or attended by, one of these addresses is never captured.
  # Use this for outside counsel and personal advisors -- it is exact-match on the
  # full address, lowercased.
  no_record_emails: []

  # Any event with an attendee at one of these domains is never captured. Domains are
  # matched on the address suffix after "@", so "examplelaw.com" also covers
  # "partner@mail.examplelaw.com" only if you list that sub-domain explicitly.
  no_record_attendee_domains: []
