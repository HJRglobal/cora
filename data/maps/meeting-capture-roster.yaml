#
# WHAT THIS FILE IS
# The bot-readable encoding of Harrison's ruling that meeting capture consolidates
# to ONE Fireflies seat -- cora@hjrglobal.com -- whose connected calendar auto-joins
# everything on it. A DWD "ensure lane" puts every qualifying roster meeting onto
# that calendar; a daily auditor checks that what got captured matches what was
# scheduled. This file names WHO is in scope and WHAT must never be recorded.
#
# HARRISON EDITS THIS FILE. Nothing here is inferred at runtime -- adding a person
# to the roster, or a phrase to the no-record list, is a human edit. That is
# deliberate: capture scope is a consent question, not something code should widen
# on its own.
#
# ── calendar_email: ONE ADDRESS PER HUMAN, AND WHY IT MATTERS ────────────────
# Several people hold cross-domain addresses that resolve to the SAME underlying
# Google calendar. Verified live 2026-08-27 by comparing event-id sets for one day:
#     tommy@hjrglobal.com  == tommy@f3energy.com          (identical event ids)
#     alex@hjrglobal.com   == alex@f3energy.com           (identical event ids)
#     larry@hjrglobal.com  == larry@bigd.media            (identical event ids)
# (control: harrison@ vs hannah@ correctly came back DIFFERENT, so the test
# discriminates.) Listing both addresses for one person would make the sweep act on
# every one of their events TWICE. So each human gets exactly ONE calendar_email.
# This is the D-096 rule -- population dedup belongs at the PHYSICAL-resource layer,
# not at roster-entry discipline. The sweep ALSO dedups by event id across the whole
# run as a belt, so a future duplicate entry degrades to a no-op rather than a
# double-write, but the single-entry rule is the primary control.
#
# Every address below was probed live 2026-08-27 and returned events (or a clean
# empty list) under the existing calendar.events DWD grant -- no new scope needed.
#
# ── SCOPE ────────────────────────────────────────────────────────────────────
# A roster user's event qualifies for capture when ALL of these hold:
#   * it has a real meeting link (Google Meet / Zoom / Teams), AND
#   * eventType is "default" (excludes workingLocation, outOfOffice, focusTime --
#     "Office" and "Dentist Appointment" show up as those and are NOT meetings), AND
#   * status is not "cancelled", AND
#   * the roster user has not declined it, AND
#   * it matches no carve-out below.
# LEX meetings ARE captured (capture-yes / team-visible-no, D-247). Their TITLES are
# never rendered in the #founder-operations audit report -- see the LEX rail in
# meeting_capture_audit.py.

# The single capture identity. Its Fireflies seat auto-joins its own calendar; the
# ensure-lane's only job is to make sure the right events are ON this calendar.
# NOTE 2026-08-27: seat was INVITED / not active at build time.
# UPDATE 2026-08-28: seat is now ACTIVE + ADMIN ("Cora Global", verified in the
# Teammates UI; bot named "Cora NoteTaker"). The ensure-lane stays DARK behind
# CORA_ONECORA_ENSURE until a few daily audits look right (plan doc, Harrison
# step 7) -- the seat itself is no longer the blocker.
capture_identity: "cora@hjrglobal.com"

