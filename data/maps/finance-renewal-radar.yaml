# Renewal / payment radar -- known recurring subscriptions and renewals.
#
# Consumed by src/cora/finance_close.py (the weekly close-support pack, section 5)
# to surface anything due or past due within RENEWAL_HORIZON_DAYS (45).
#
# READ-ONLY for Cora: she reads this file and reports; she never edits it.
# Harrison / Justin maintain it. If this file is missing, unreadable, or has no
# `renewals:` list, the radar section renders as an honest STUB -- never as a
# silently empty "nothing due" (a blank radar reads as all-clear, which is the
# exact failure mode the Standing-ACTUALS label doctrine warns about).
#
# Fields per entry:
#   name      (required) what it is -- shown verbatim
#   entity    (optional) which entity pays it; shown as a [TAG]
#   amount    (optional) numeric USD, no currency symbol or commas
#   cadence   (optional) free text, e.g. "monthly", "annual"
#   next_due  (optional) ISO date YYYY-MM-DD. An entry with no parseable
#             next_due is NOT assessed and is reported as such by name --
#             it is never silently dropped.
#   confirmed (optional) set `false` while the date/amount is an unverified seed.
#             A false entry renders "UNCONFIRMED date/amount, verify before
#             acting" and the section footer says the radar is a partial list.
#             OMIT the key (or set true) once Justin has verified the entry.
#   notes     (optional) free text for humans; NOT rendered anywhere -- put
#             anything a reader must see in `name` or use `confirmed: false`
#
# UPDATE next_due AFTER EACH RENEWAL. A stale past date renders as PAST DUE,
# which is the intended nag -- but if it stays stale it becomes noise, so the
# weekly pack is the reminder to roll the date forward.

renewals:
  - name: Meta Verified (F3 Energy)
    entity: F3E
    cadence: monthly
    next_due: 2026-08-15
    confirmed: false
    notes: >-
      Seeded 2026-08-04 from the close-support kickoff. CONFIRM the amount and
      the true renewal date with Justin, then set `amount:` and flip
      `confirmed: true`.

  - name: Judge.me (F3 Energy reviews)
    entity: F3E
    cadence: monthly
    next_due: 2026-08-15
    confirmed: false
    notes: >-
      Seeded 2026-08-04 from the close-support kickoff. CONFIRM the amount and
      the true renewal date with Justin, then set `amount:` and flip
      `confirmed: true`.

  - name: Klaviyo (F3 Energy email/SMS)
    entity: F3E
    cadence: monthly
    next_due: 2026-09-01
    confirmed: false
    notes: >-
      Seeded 2026-08-25 by C14 (cq-118f8bbf842e). Klaviyo publishes NO billing,
      plan or invoice endpoint, so neither the amount nor the true renewal date
      can be read from the API -- the monthly audit
      (scripts/run_klaviyo_billing_audit.py) can only DERIVE the charge basis
      from profile counts. Measured 2026-08-25: 4,464 email-marketable profiles
      (account VFstej) plus 2,247 SMS-subscribed, which Klaviyo bills
      separately. CONFIRM the amount and renewal date with Justin off an actual
      invoice, then set `amount:` and flip `confirmed: true`. This was the one
      live recurring-charge surface Cora already reads weekly and Klaviyo was
      absent from it.
