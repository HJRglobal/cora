# F3 Brand Social Media Accounts — used by the influencer scan scheduler
#
# Handles confirmed by Harrison 2026-05-23.
#
# Still needed after completing META_SETUP_GUIDE.md:
#   - instagram.ig_user_id_env: populate the corresponding .env key with the
#     numeric IG Business Account ID (from META_SETUP_GUIDE step 4)
#   - instagram.access_token_env: populate with the Long-Lived Access Token
#     (from META_SETUP_GUIDE step 5)
#
# .env keys to add:
#   INSTAGRAM_F3E_USER_ID=<numeric ID>
#   INSTAGRAM_F3E_ACCESS_TOKEN=<LLAT>
#   INSTAGRAM_F3MOOD_USER_ID=<numeric ID>       ← for @drinkf3mood (see note below)
#   INSTAGRAM_F3MOOD_ACCESS_TOKEN=<LLAT>
#   INSTAGRAM_F3PURE_USER_ID=<numeric ID>
#   INSTAGRAM_F3PURE_ACCESS_TOKEN=<LLAT>
#
# Slack channel for detection notifications:
#   INFLUENCER_SCAN_NOTIFY_CHANNEL=f3-sales   (channel name without #)
#
# 2026-08-06 (social-consolidation decision, Option C — see
# 02-F3-Energy/projects/plan-f3-energy-social-media-consolidatio/):
#   - @f3mood IG handle reclaim is PAUSED (USPTO SN 99009987 suspended, no
#     registration number exists to file a trademark claim against the
#     dormant holder). Handle stays @drinkf3mood indefinitely. Do NOT flip
#     to @f3mood on a "transfer completes" assumption anymore.
#   - @f3pure + @drinkf3mood (IG) and their TikTok counterparts are PARKED
#     for native posting (bio redirects to @f3energy) — all new F3 social
#     content lives on @f3energy as one house stream. This monitoring config
#     is UNAFFECTED (still watch these handles/hashtags for tags + mentions);
#     parking is a posting-cadence decision, not a monitoring one.
#
# Last updated: 2026-08-06

brands:
  - entity: F3E
    display_name: "F3 Energy"
    instagram:
      handle: "f3energy"
      ig_user_id_env: "INSTAGRAM_F3E_USER_ID"
      access_token_env: "INSTAGRAM_F3E_ACCESS_TOKEN"
      monitored_hashtags:
        - "F3Energy"
        - "DrinkF3Energy"
        - "DrinkF3"
    tiktok:
      handle: "f3energy"
      # Monitoring pending TikTok Research API approval — see tiktok_monitor.py

  - entity: F3E
    display_name: "F3 Mood"
    instagram:
      # Handle is @drinkf3mood, permanently (reclaim of @f3mood PAUSED
      # 2026-08-06 — see header note; SN 99009987 suspended, nothing to file).
      # PARKED for native content 2026-08-06: bio redirects to @f3energy.
      handle: "drinkf3mood"
      ig_user_id_env: "INSTAGRAM_F3MOOD_USER_ID"
      access_token_env: "INSTAGRAM_F3MOOD_ACCESS_TOKEN"
      monitored_hashtags:
        - "DrinkF3Mood"
        - "F3Mood"          # kept as a monitored tag regardless of handle status
        - "CalmTheNoise"
    tiktok:
      handle: "f3mood"  # PARKED for native content 2026-08-06 (bio redirects to @f3energy); TikTok Shop marketing-account link + showcase KEPT as-is
      # Monitoring pending TikTok Research API approval — see tiktok_monitor.py

  - entity: F3E
    display_name: "F3 Pure"
    instagram:
      handle: "f3pure"
      ig_user_id_env: "INSTAGRAM_F3PURE_USER_ID"
      access_token_env: "INSTAGRAM_F3PURE_ACCESS_TOKEN"
      monitored_hashtags:
        - "F3Pure"
        - "DrinkF3Pure"
        - "RealEnergyRealLife"
    tiktok:
      handle: "f3pure"  # PARKED for native content 2026-08-06 (bio redirects to @f3energy); TikTok Shop marketing-account link + showcase KEPT as-is
      # Monitoring pending TikTok Research API approval — see tiktok_monitor.py
