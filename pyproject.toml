[project]
name = "cora"
version = "0.1.0"
description = "Entity-aware Slack Q&A bot for HJR workspace"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.18",
    "anthropic>=0.49",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "google-auth>=2.30",
    "google-api-python-client>=2.140",
    # Phase 3 — Knowledge Base + RAG
    "openai>=1.50",          # embeddings via text-embedding-3-small
    "tiktoken>=0.7",         # token counting for chunker (cl100k_base encoding)
    "sqlite-vec>=0.1.6",     # vector search extension for sqlite
    "openpyxl>=3.1",         # xlsx parsing for inventory_client (Weekly Inventory Report)
    "pdfplumber>=0.10",      # PDF text extraction for drive_sweep connector
    "mcp>=2.0",              # read-only MCP server (scripts/run_mcp_server.py) — stdio, founder-scope
]

[project.scripts]
cora = "cora.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cora"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# The resolver cutoff uv.lock was built with (recorded there under [options]; DR/VM
# step 1, 2026-09-23). Without this pin a plain `uv sync` reads that recorded value
# as a REMOVED global setting ("Resolving despite existing lockfile due to removal
# of global exclude newer"), re-resolves and silently upgrades packages (mcp 2.0.0
# -> 2.2.0 et al., 2026-09-24).
# To move it: edit THIS value (always a full instant with Z -- a date-only value is
# read as the end of the LOCAL day), then run plain `uv lock` (or `uv lock --upgrade`
# for the quarterly patch pass, SECURITY.md), review the diff, and commit
# pyproject.toml + uv.lock together. Never pass --exclude-newer on the command line:
# the flag overrides this setting and writes a different cutoff into uv.lock.
# tests/test_uv_exclude_newer_pin.py keeps the two values equal.
exclude-newer = "2026-07-30T00:00:00Z"
